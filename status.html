<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حالة النظام - Roblox AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #00b4d8; margin-bottom: 20px; }
        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .status-card { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 20px; }
        .status-card h3 { color: #00b4d8; margin-bottom: 10px; }
        .status-card .value { font-size: 2rem; font-weight: bold; color: #10b981; }
        .status-card .label { color: #888; font-size: 0.9rem; }
        .btn { background: #00b4d8; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 5px; }
        .btn:hover { background: #0096c7; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .pages-list { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .page-item { background: #0a0a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .page-item h4 { color: #00b4d8; margin-bottom: 5px; word-break: break-all; }
        .page-item p { color: #888; font-size: 0.85rem; }
        .loading { color: #fbbf24; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        #log { background: #0a0a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; }
        .log-entry { margin-bottom: 5px; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #00b4d8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 حالة النظام</h1>
        
        <div class="status-grid">
            <div class="status-card">
                <h3>📡 السيرفر</h3>
                <div id="serverStatus" class="value loading">جاري التحقق...</div>
                <div class="label">http://localhost:3000</div>
            </div>
            <div class="status-card">
                <h3>📄 الصفحات المحفوظة</h3>
                <div id="pagesCount" class="value">0</div>
                <div class="label">صفحة محفوظة</div>
            </div>
            <div class="status-card">
                <h3>⏰ آخر زحف</h3>
                <div id="lastCrawl" class="value">لا يوجد</div>
                <div class="label">آخر تحديث</div>
            </div>
            <div class="status-card">
                <h3>🔍 محرك البحث</h3>
                <div id="searchStatus" class="value success">جاهز</div>
                <div class="label">BM25 Search Engine</div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 10px;">🧪 اختبار الزاحف</h2>
            <input type="text" id="crawlUrl" placeholder="أدخل URL للجلب..." style="width: 70%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: white; font-size: 1rem;">
            <button class="btn" onclick="crawlUrl()">🔍 جلب الصفحة</button>
        </div>

        <div style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 10px;">🔍 اختبار البحث</h2>
            <input type="text" id="searchQuery" placeholder="ابحث في المحتوى المحفوظ..." style="width: 70%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: white; font-size: 1rem;">
            <button class="btn" onclick="searchContent()">🔍 بحث</button>
        </div>

        <div id="searchResults"></div>

        <div style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 10px;">⚡ اختبارات سريعة</h2>
            <button class="btn" onclick="crawlRobloxDocs()">📄 جلب وثائق Roblox</button>
            <button class="btn" onclick="crawlMultiple()">📚 جلب صفحات متعددة</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ حذف كل البيانات</button>
        </div>

        <div id="log"></div>

        <div class="pages-list">
            <h2 style="margin-bottom: 15px;">📄 الصفحات المحفوظة</h2>
            <div id="pagesList">جاري التحميل...</div>
        </div>
    </div>

    <script>
        const API = '';

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            el.innerHTML = `<div class="log-entry log-${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>` + el.innerHTML;
        }

        async function checkStatus() {
            try {
                const res = await fetch(API + '/api/pages');
                const data = await res.json();
                document.getElementById('serverStatus').textContent = 'شغال ✅';
                document.getElementById('serverStatus').className = 'value success';
                document.getElementById('pagesCount').textContent = data.count;
                document.getElementById('lastCrawl').textContent = data.lastCrawl ? new Date(data.lastCrawl).toLocaleString() : 'لا يوجد';
                log('تم التحقق من السيرفر', 'success');
                updatePagesList(data.pages);
            } catch (e) {
                document.getElementById('serverStatus').textContent = 'متوقف ❌';
                document.getElementById('serverStatus').className = 'value error';
                log('السيرفر متوقف: ' + e.message, 'error');
            }
        }

        function updatePagesList(pages) {
            const el = document.getElementById('pagesList');
            if (pages.length === 0) {
                el.innerHTML = '<p style="color: #888;">لا توجد صفحات محفوظة</p>';
                return;
            }
            el.innerHTML = pages.map(p => `
                <div class="page-item">
                    <h4>${p.url}</h4>
                    <p>${p.text.substring(0, 200)}...</p>
                    <small style="color: #666;">${new Date(p.time).toLocaleString()}</small>
                </div>
            `).join('');
        }

        async function crawlUrl() {
            const url = document.getElementById('crawlUrl').value;
            if (!url) return log('أدخل URL أولاً', 'error');
            log('جاري جلب: ' + url, 'info');
            try {
                const res = await fetch(API + '/api/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    log('✅ تم الجلب بنجاح! (' + data.text.length + ' حرف)', 'success');
                } else {
                    log('❌ فشل الجلب: ' + data.error, 'error');
                }
                checkStatus();
            } catch (e) {
                log('❌ خطأ: ' + e.message, 'error');
            }
        }

        async function crawlRobloxDocs() {
            const urls = [
                'https://create.roblox.com/docs/reference/engine/classes/Part',
                'https://create.roblox.com/docs/reference/engine/classes/Players',
                'https://create.roblox.com/docs/reference/engine/classes/TweenService',
                'https://create.roblox.com/docs/reference/engine/classes/DataStoreService',
                'https://create.roblox.com/docs/reference/engine/classes/RemoteEvent',
                'https://create.roblox.com/docs/reference/engine/classes/GuiObject'
            ];
            log('جاري جلب ' + urls.length + ' صفحات...', 'info');
            try {
                const res = await fetch(API + '/api/crawl-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });
                const data = await res.json();
                const success = data.filter(r => r.status === 'success').length;
                log('✅ تم جلب ' + success + ' من ' + urls.length + ' صفحات', 'success');
                checkStatus();
            } catch (e) {
                log('❌ خطأ: ' + e.message, 'error');
            }
        }

        async function crawlMultiple() {
            const urls = [
                'https://create.roblox.com/docs/reference/engine/classes/Workspace',
                'https://create.roblox.com/docs/reference/engine/classes/Lighting',
                'https://create.roblox.com/docs/reference/engine/classes/UserInputService',
                'https://create.roblox.com/docs/reference/engine/classes/RunService',
                'https://create.roblox.com/docs/reference/engine/classes/CollectionService'
            ];
            log('جاري جلب ' + urls.length + ' صفحات...', 'info');
            try {
                const res = await fetch(API + '/api/crawl-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });
                const data = await res.json();
                const success = data.filter(r => r.status === 'success').length;
                log('✅ تم جلب ' + success + ' من ' + urls.length + ' صفحات', 'success');
                checkStatus();
            } catch (e) {
                log('❌ خطأ: ' + e.message, 'error');
            }
        }

        async function searchContent() {
            const q = document.getElementById('searchQuery').value;
            if (!q) return log('أدخل كلمة بحث أولاً', 'error');
            log('جاري البحث: ' + q, 'info');
            try {
                const res = await fetch(API + '/api/search?q=' + encodeURIComponent(q));
                const data = await res.json();
                const el = document.getElementById('searchResults');
                if (data.length === 0) {
                    el.innerHTML = '<div class="page-item"><h4>لا توجد نتائج</h4></div>';
                    log('لا توجد نتائج', 'error');
                } else {
                    el.innerHTML = data.map(r => `
                        <div class="page-item">
                            <h4>🔗 ${r.url}</h4>
                            <p>${r.excerpt}</p>
                        </div>
                    `).join('');
                    log('✅ وجدنا ' + data.length + ' نتائج', 'success');
                }
            } catch (e) {
                log('❌ خطأ: ' + e.message, 'error');
            }
        }

        async function clearAll() {
            if (!confirm('هل أنت متأكد من حذف كل البيانات؟')) return;
            try {
                await fetch(API + '/api/pages', { method: 'DELETE' });
                log('🗑️ تم حذف كل البيانات', 'success');
                checkStatus();
            } catch (e) {
                log('❌ خطأ: ' + e.message, 'error');
            }
        }

        checkStatus();
        setInterval(checkStatus, 5000);
    </script>
</body>
</html>
